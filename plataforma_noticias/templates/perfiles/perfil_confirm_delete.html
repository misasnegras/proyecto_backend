{% extends 'base.html' %}
{% block title %}Eliminar Perfil | Plataforma de Noticias{% endblock %}
{% block content %}
<section class="panel" style="max-width: 600px; margin: 0 auto;">
    <div class="cabecera-vista">
        <h1>Confirmar Eliminación</h1>
    </div>
    <div class="alerta-borrar">
        ¿Estás seguro de eliminar el perfil de <strong>"{{ perfil.usuario.username }}"</strong> (RUT {{ perfil.rut }})?
    </div>
    <form method="post" class="acciones">
        {% csrf_token %}
        <button type="submit" class="btn btn-rojo">Sí, eliminar</button>
        <a href="{% url 'perfil_list' %}" class="btn btn-secundario">Cancelar</a>
    </form>
</section>
{% endblock %}
